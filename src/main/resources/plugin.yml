name: BedrockBrewGUI
version: 1.0.0
main: tw.sunrisemc.bedrockbrew.BedrockBrewPlugin
api-version: '1.21'
folia-supported: true
depend: [floodgate]
commands:
  brew:
    description: 開啟基岩版快速釀造
    usage: /brew
    permission: bedrockbrew.use
    permission-message: 你沒有使用此介面的權限。
permissions:
  bedrockbrew.use:
    default: true
